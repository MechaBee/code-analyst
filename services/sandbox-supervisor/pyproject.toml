[tool.poetry]
name = "code-analyst-sandbox-supervisor"
version = "0.1.0"
description = "Sandbox lifecycle API for the code analyst local-first platform."
authors = ["Molnár Balázs <balazs.molnar@formula400.hu>"]
readme = "README.md"
packages = [{ include = "sandbox_supervisor_app" }]

[tool.poetry.dependencies]
python = "3.11.11"
boto3 = "^1.38.0"
claude-agent-sdk = "^0.1.68"
fastapi = ">=0.115,<1.0"
openai-agents = "^0.14.2"
pydantic-settings = ">=2.3,<3.0"
uvicorn = { extras = ["standard"], version = ">=0.30,<1.0" }
code-analyst-contracts = { path = "../../packages/contracts/python", develop = true }
zstandard = "^0.23.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
